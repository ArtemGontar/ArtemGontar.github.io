<style>

    --page: #101214;

    --ink: #f2f3f4;

    background:
      radial-gradient(circle at 8% 0%, rgba(73,117,180,0.20), transparent 32rem),

<body>
<header class="masthead">
  <a href="../">Token Economy</a>
  <span>Research note · 20 September 2026</span>
</header>

<main class="article-shell">
  <article class="article" id="article">
    <p>Loading article…</p>
  </article>
  <p class="article-footer"><a href="../">Back to the presentation</a> · <a href="token-economy.md">Read the Markdown source</a></p>
</main>

<script>
(() => {
  const root = document.getElementById("article");

  const escapeHtml = (value) => value
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

  const inline = (value) => {
    const tokens = [];
    const stash = (html) => {
      const key = `\u0000${tokens.length}\u0000`;
      tokens.push(html);
      return key;
    };
    let text = escapeHtml(value);
    text = text.replace(/`([^`]+)`/g, (_, code) => stash(`<code>${code}</code>`));
    text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, src) =>
      stash(`<figure><img src="${src}" alt="${alt}" loading="lazy"><figcaption>${alt}</figcaption></figure>`));
    text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, label, url) =>
      stash(`<a href="${url}" target="_blank" rel="noopener">${label}</a>`));
    text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    return text.replace(/\u0000(\d+)\u0000/g, (_, index) => tokens[Number(index)]);
  };

  const isTableSeparator = (line) => /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line);
  const tableCells = (line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());

  const render = (source) => {
    const lines = source.replace(/\r\n/g, "\n").split("\n");
    const html = [];
    let paragraph = [];
    let listType = null;
    let code = false;
    let codeLines = [];

    const flushParagraph = () => {
      if (!paragraph.length) return;
      html.push(`<p>${inline(paragraph.join(" "))}</p>`);
      paragraph = [];
    };

    const closeList = () => {
      if (!listType) return;
      html.push(`</${listType}>`);
      listType = null;
    };

    const flushCode = () => {
      if (!code) return;
      html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
      codeLines = [];
      code = false;
    };

    for (let i = 0; i < lines.length; i += 1) {
      const line = lines[i];
      if (line.startsWith("```")) {
        flushParagraph();
        closeList();
        if (code) flushCode();
        else code = true;
        continue;
      }
      if (code) {
        codeLines.push(line);
        continue;
      }
      if (!line.trim()) {
        flushParagraph();
        closeList();
        continue;
      }
      const heading = line.match(/^(#{1,3})\s+(.+)$/);
      if (heading) {
        flushParagraph();
        closeList();
        const level = heading[1].length;
        html.push(`<h${level}>${inline(heading[2])}</h${level}>`);
        continue;
      }
      const image = line.match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/);
      if (image) {
        flushParagraph();
        closeList();
        html.push(inline(line));
        continue;
      }
      if (line.startsWith("|") && i + 1 < lines.length && isTableSeparator(lines[i + 1])) {
        flushParagraph();
        closeList();
        const headers = tableCells(line);
        const rows = [];
        i += 2;
        while (i < lines.length && lines[i].trim().startsWith("|")) {
          rows.push(tableCells(lines[i]));
          i += 1;
        }
        i -= 1;
        html.push(`<table><thead><tr>${headers.map((cell) => `<th>${inline(cell)}</th>`).join("")}</tr></thead><tbody>`);
        rows.forEach((row) => {
          html.push(`<tr>${row.map((cell) => `<td>${inline(cell)}</td>`).join("")}</tr>`);
        });
        html.push("</tbody></table>");
        continue;
      }
      const ordered = line.match(/^\d+\.\s+(.+)$/);
      const unordered = line.match(/^-\s+(.+)$/);
      if (ordered || unordered) {
        flushParagraph();
        const nextType = ordered ? "ol" : "ul";
        if (listType !== nextType) {
          closeList();
          listType = nextType;
          html.push(`<${listType}>`);
        }
        html.push(`<li>${inline((ordered || unordered)[1])}</li>`);
        continue;
      }
      closeList();
      paragraph.push(line.trim());
    }
    flushParagraph();
    closeList();
    flushCode();
    return html.join("\n");
  };

  fetch("token-economy.md")
    .then((response) => {
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.text();
    })
    .then((markdown) => { root.innerHTML = render(markdown); })
    .catch((error) => {
      root.innerHTML = `<p class="error">The article could not be loaded: ${escapeHtml(error.message)}</p>`;
    });
})();
</script>
</body>
</html>
